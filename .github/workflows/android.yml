name: Android

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:
    inputs:
      ocr_profile:
        description: "PP-OCR preprocessing profile to bake into the APK"
        required: false
        default: stable-mobile
        type: choice
        options:
          - stable-mobile
          - high-res-preprocess
          - ocr-recovery-test
      apk_kind:
        description: "APK kind to build"
        required: false
        default: standalone-release
        type: choice
        options:
          - standalone-release
          - development-debug

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Expo prebuild and Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_ROUTELO_OCR_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.ocr_profile || 'stable-mobile' }}
      ROUTELO_APK_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.apk_kind || 'standalone-release' }}
    defaults:
      run:
        working-directory: routelo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: routelo/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Report OCR profile
        run: |
          echo "EXPO_PUBLIC_ROUTELO_OCR_PROFILE=$EXPO_PUBLIC_ROUTELO_OCR_PROFILE"
          echo "ROUTELO_APK_KIND=$ROUTELO_APK_KIND"

      - name: Verify shared PP-OCR models
        run: npm run verify:ocr-models

      - name: Export Android application assets
        run: npx expo export --platform android --output-dir dist-android

      - name: Verify PP-OCR models are bundled
        run: |
          node -e "const assets=require('./dist-android/metadata.json').fileMetadata.android.assets; const models=assets.filter(({ext})=>ext==='onnx'); if(models.length<2) process.exit(1); console.log(models)"

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build development debug APK
        if: env.ROUTELO_APK_KIND == 'development-debug'
        run: ./android/gradlew -p android :app:assembleDebug --no-daemon

      - name: Build standalone release APK
        if: env.ROUTELO_APK_KIND == 'standalone-release'
        run: ./android/gradlew -p android :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload development debug APK
        if: env.ROUTELO_APK_KIND == 'development-debug'
        uses: actions/upload-artifact@v4
        with:
          name: routelo-development-debug-${{ env.EXPO_PUBLIC_ROUTELO_OCR_PROFILE }}-${{ github.sha }}
          path: routelo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload standalone release APK
        if: env.ROUTELO_APK_KIND == 'standalone-release'
        uses: actions/upload-artifact@v4
        with:
          name: routelo-standalone-release-${{ env.EXPO_PUBLIC_ROUTELO_OCR_PROFILE }}-${{ github.sha }}
          path: routelo/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
